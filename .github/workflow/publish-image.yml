name: Publish Docker Images to GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write 

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (for advanced builds and caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Build and push the server image
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/server:latest
            ghcr.io/${{ github.repository_owner }}/server:${{ github.sha }}

      # Step 5: Build and push the speech image
      - name: Build and push speech image
        uses: docker/build-push-action@v6
        with:
          context: ./speech
          file: ./speech/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/speech:latest
            ghcr.io/${{ github.repository_owner }}/speech:${{ github.sha }}

      # Step 6: Build and push the UI image
      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ui:latest
            ghcr.io/${{ github.repository_owner }}/ui:${{ github.sha }}
