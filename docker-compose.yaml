services:
  server:
    container_name: server
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "9000:9000"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - SPEECH_SERVICE_URL=http://speech:8001 
      - OLLAMA_MODEL=gemma3
    depends_on:
      - ollama
      - chroma
      
  speech:
    container_name: speech
    build:
      context: ./speech
      dockerfile: Dockerfile
    # Remove the entire deploy section
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HUB_CACHE=/app/models
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      # Remove NVIDIA environment variables
    volumes:
      - ./server/src/recordings:/app/recordings
      - ./server/src/transcripts:/app/transcripts
      - ./server/images/campaign_images:/app/server/images/campaign_images
      - ./models:/app/models


  ui:
    container_name: ui
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:9000 
    depends_on:
      - server

  chroma:
    container_name: chroma
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"  
    volumes:
      - ./chroma/chroma_data:/data


  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma3
      - OLLAMA_CUDA=1
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  ollama:

